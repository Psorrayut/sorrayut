<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GPU Shadow + GUI</title>
  <style>
    body { margin: 0; overflow: hidden; }
    #ui {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
      line-height: 1.5em;
      z-index: 10;
    }
    #ui span {
      color: #00ffcc;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <!-- UI overlay -->
  <div id="ui">
    <div><span>[1]</span> BaseColor</div>
    <div><span>[2]</span> Metallic</div>
    <div><span>[3]</span> Roughness</div>
  </div>

  <!-- core three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <!-- dat.GUI -->
  <script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>

  <script>
    const renderer = new THREE.WebGLRenderer({ antialias:true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();

    // Camera & Controls
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 5);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    // Directional Light
    const light = new THREE.DirectionalLight(0xffffff, 1);
    light.position.set(5, 10, 5);
    light.castShadow = true;
    light.shadow.mapSize.set(1024, 1024);
    light.shadow.camera.near = 0.5;
    light.shadow.camera.far = 50;
    scene.add(light);

    // Ambient Light
    scene.add(new THREE.AmbientLight(0x404040));

    // Base textures
    const textureLoader = new THREE.TextureLoader();
    const baseColorMap = textureLoader.load('https://psorrayut.github.io/sorrayut/Low_Mech2_BaseColor.png');
    const Metal = textureLoader.load('https://psorrayut.github.io/sorrayut/Low_Mech1_Metallic.png');
    const Rough = textureLoader.load('https://psorrayut.github.io/sorrayut/Low_Mech1_Roughness.png');
    const baseColorMap2 = textureLoader.load('https://psorrayut.github.io/sorrayut/building.jpeg');

    // ---------- dat.GUI ----------
    const gui = new dat.GUI();

    // Light GUI
    const lightParams = {
      lightX: light.position.x,
      lightY: light.position.y,
      lightZ: light.position.z,
      intensity: light.intensity,
      color: '#ffffff'
    };
    const lightFolder = gui.addFolder("Light");
    lightFolder.add(lightParams, 'lightX', -20, 20).onChange(v => light.position.x = v);
    lightFolder.add(lightParams, 'lightY',  0, 20).onChange(v => light.position.y = v);
    lightFolder.add(lightParams, 'lightZ', -20, 20).onChange(v => light.position.z = v);
    lightFolder.add(lightParams, 'intensity', 0, 2).onChange(v => light.intensity = v);
    lightFolder.addColor(lightParams, 'color').onChange(v => light.color.set(v));

    // Robot material reference
    let robotMaterial;

    // Load OBJ Robot
    const loader = new THREE.OBJLoader();
    loader.load('https://psorrayut.github.io/sorrayut/gundam.obj', function (object) {
      object.traverse(function (child) {
        if (child.isMesh) {
          robotMaterial = new THREE.MeshStandardMaterial({
            map: baseColorMap,
            roughness: 0.6,
            metalness: 0.3,
            color: 0xffffff
          });
          child.material = robotMaterial;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      scene.add(object);

      // GUI for robot
      const robotParams = {
        roughness: 0.6,
        metalness: 0.3,
        color: '#ffffff'
      };
      const robotFolder = gui.addFolder("Robot Material");
      robotFolder.add(robotParams, 'roughness', 0, 1).onChange(v => robotMaterial.roughness = v);
      robotFolder.add(robotParams, 'metalness', 0, 1).onChange(v => robotMaterial.metalness = v);
      robotFolder.addColor(robotParams, 'color').onChange(v => robotMaterial.color.set(v));
    });

    // Load OBJ Tower
    const loader2 = new THREE.OBJLoader();
    loader2.load('https://psorrayut.github.io/sorrayut/tower.obj', function (object2) {
      let towerMaterial;
      object2.traverse(function (child) {
        if (child.isMesh) {
          towerMaterial = new THREE.MeshStandardMaterial({
            map: baseColorMap2,
            roughness: 0.6,
            metalness: 0.3,
            color: 0xffffff
          });
          child.material = towerMaterial;
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });
      object2.scale.set(0.1, 0.1, 0.1);
      object2.position.set(1,0,1.5);
      scene.add(object2);

      // GUI for tower
      const towerParams = {
        roughness: 0.6,
        metalness: 0.3,
        color: '#ffffff'
      };
      const towerFolder = gui.addFolder("Tower Material");
      towerFolder.add(towerParams, 'roughness', 0, 1).onChange(v => towerMaterial.roughness = v);
      towerFolder.add(towerParams, 'metalness', 0, 1).onChange(v => towerMaterial.metalness = v);
      towerFolder.addColor(towerParams, 'color').onChange(v => towerMaterial.color.set(v));
    });

    // Background + Floor
    const bg = textureLoader.load('https://psorrayut.github.io/sorrayut/evan.jpg');
    const evanloader = new THREE.TextureLoader();
    evanloader.load('https://psorrayut.github.io/sorrayut/evan5.jpg', function (texture) {
      const planeGeo = new THREE.PlaneGeometry(10, 10);
      const planeMat = new THREE.MeshStandardMaterial({ 
        map: texture,
        roughness: 0.6,
        metalness: 0.2,
        color: 0xffffff
      });
      const plane = new THREE.Mesh(planeGeo, planeMat);
      plane.rotation.x = -Math.PI/2;
      plane.position.y = 0;
      plane.receiveShadow = true;
      scene.add(plane);
      scene.background = bg;
    });

    // ---------- Key press to switch textures ----------
    function switchTexture(key) {
      if (!robotMaterial) return;
      switch (key) {
        case "1":
          robotMaterial.map = baseColorMap;
          break;
        case "2":
          robotMaterial.map = Metal;
          break;
        case "3":
          robotMaterial.map = Rough;
          break;
      }
      robotMaterial.needsUpdate = true;
    }

    window.addEventListener("keydown", (e) => {
      switchTexture(e.key);
    });

    // ---------- render loop ----------
    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
