<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Driving in City • Three.js</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      font-family: monospace;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border-radius: 5px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="info">
    คลิกที่โมเดล Maid เพื่อหันกล้องไปมอง<br>
    กด W/A/S/D เพื่อขับรถ (กล้องจะกลับมาตามรถอัตโนมัติ)<br>
    กด ESC เพื่อกลับสู่โหมดกล้องตามรถ
  </div>
  
  <script>
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0a0a0a, 20, 150);
    scene.background = new THREE.Color(0x050505);

    // Camera & Controls
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
    camera.position.set(0, 3, 8);
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableZoom = true;
    controls.zoomSpeed = 1.2;
    controls.minDistance = 2;
    controls.maxDistance = 30;
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.2;
    //bg light
    scene.fog = new THREE.Fog(0x111111, 40, 200);
    scene.background = new THREE.Color(0x101010);
    // Lights
  const light = new THREE.DirectionalLight(0x8899ff, 1.5); // สว่างขึ้น
  light.position.set(20, 30, 10);
  light.castShadow = true;
  light.shadow.mapSize.set(2048, 2048);
  light.shadow.camera.left = -50;
  light.shadow.camera.right = 50;
  light.shadow.camera.top = 50;
  light.shadow.camera.bottom = -50;
  scene.add(light);
    
  scene.add(new THREE.AmbientLight(0x404040, 1.2)); // เพิ่มแสงรวมในฉาก

    // ประกาศตัวแปรที่จำเป็นก่อน
    let car, mixerCar, mixerMaid, maid;
    const clickable = []; // เก็บ object ที่คลิกได้
    
//หันกล้อง (เหมือนโค้ดต้นแบบ)
let cameraTarget = new THREE.Vector3(); // จุดที่กล้องจะมอง
let isAutoCamera = false; // ตัวแปรควบคุมว่ากำลังใช้โหมดกล้องอัตโนมัติหรือไม่
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

function setPointer(e) {
  const r = renderer.domElement.getBoundingClientRect();
  const x = (e.clientX ?? e.touches[0].clientX) - r.left;
  const y = (e.clientY ?? e.touches[0].clientY) - r.top;
  pointer.x = (x / r.width) * 2 - 1;
  pointer.y = -(y / r.height) * 2 + 1;
}

function onPick(e) {
  if (!maid) {
    console.log('maid ยังไม่โหลด');
    return;
  }
  
  setPointer(e);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickable, true)[0];
  
  console.log('คลิก!', hit ? 'เจอ object' : 'ไม่เจอ');
  
  if (!hit) {
    return;
  }
  
  console.log('คลิกที่:', hit.object);
  
  // หาว่าคลิก object ไหน
  let targetObject = hit.object;
  while (targetObject.parent && targetObject.parent.type !== 'Scene') {
    targetObject = targetObject.parent;
  }
  
  console.log('Target object:', targetObject.name);
  
  if (targetObject === maid || hit.object.parent === maid || hit.object.parent.parent === maid) {
    console.log('เจอ maid แล้ว! ตั้งค่า cameraTarget');
    isAutoCamera = true; // เปิดโหมดกล้องอัตโนมัติ
    
    // ตั้งค่า cameraTarget ให้เป็นตำแหน่งของ maid (เหมือนโค้ดต้นแบบ)
    cameraTarget.copy(maid.position);
    cameraTarget.y += 1; // ยกสูงขึ้นเล็กน้อย
  }
}

renderer.domElement.addEventListener('click', onPick);
renderer.domElement.addEventListener('touchend', (e) => { onPick(e); }, { passive: true });
    // Spotlight (ไฟหน้ารถ)
    const spotLight = new THREE.SpotLight(0xffffff, 1.5);
    spotLight.angle = Math.PI / 6;
    spotLight.penumbra = 0.3;
    spotLight.decay = 2;
    spotLight.distance = 30;
    spotLight.castShadow = true;
    scene.add(spotLight);

    // Keyboard Controls
    const keys = {};
    document.addEventListener('keydown', (e) => { keys[e.key.toLowerCase()] = true; });
    document.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });
    
    const speed = 0.1;
    const rotateSpeed = 0.04;

    function updateCar() {
      if (!car) return;

      // ระบบกล้อง: ถ้ากด ESC หรือเคลื่อนรถ ให้กลับมาใช้กล้องตามรถ
      if (keys['escape'] || keys['w'] || keys['s'] || keys['a'] || keys['d']) {
        isAutoCamera = false;
        controls.enabled = true;
      }

      if (keys['w']) {
        car.position.x += speed * Math.sin(car.rotation.y);
        car.position.z += speed * Math.cos(car.rotation.y);
      }
      if (keys['s']) {
        car.position.x -= speed * Math.sin(car.rotation.y);
        car.position.z -= speed * Math.cos(car.rotation.y);
      }
      if (keys['a']) { car.rotation.y += rotateSpeed; }
      if (keys['d']) { car.rotation.y -= rotateSpeed; }

      // ไฟหน้ารถติดตาม
      if (spotLight) {
        spotLight.position.copy(car.position);
        spotLight.position.y += 1;
        const direction = new THREE.Vector3(
          Math.sin(car.rotation.y),
          -0.3,
          Math.cos(car.rotation.y)
        );
        spotLight.target.position.copy(car.position).add(direction.multiplyScalar(10));
        spotLight.target.updateMatrixWorld();
      }
    }

    function updateCamera() {
      if (!car) return;
      
      // จัดการกล้องตามโหมด (ใช้ controls.target.lerp เหมือนโค้ดต้นแบบ)
      if (isAutoCamera) {
        // โหมดมองไปที่ maid - ใช้ lerp กับ controls.target เท่านั้น
        controls.target.lerp(cameraTarget, 0.02);
        
        console.log('กำลัง lerp ไปที่:', cameraTarget, 'ปัจจุบัน:', controls.target);
      } else {
        // โหมดกล้องติดตามรถปกติ
        const offset = new THREE.Vector3(
          -Math.sin(car.rotation.y) * 8,
          3,
          -Math.cos(car.rotation.y) * 8
        );
        const targetPos = car.position.clone().add(offset);
        
        camera.position.lerp(targetPos, 0.1);
        controls.target.lerp(car.position, 0.1);
      }
    }

    // โหลดรถ
    const carLoader = new THREE.GLTFLoader();
    carLoader.load('https://psorrayut.github.io/sorrayut/flyingcar.glb',
      function (gltf) {
        car = gltf.scene;
        
        if (gltf.animations && gltf.animations.length > 0) {
          mixerCar = new THREE.AnimationMixer(car);
          gltf.animations.forEach((clip) => {
            const action = mixerCar.clipAction(clip);
            action.play();
          });
        }
        
        car.traverse(function (child) {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });
        
        car.rotation.y = Math.PI / 2;
        car.position.y = 0.5;
        scene.add(car);
        console.log('รถโหลดสำเร็จ');
      }
    );
    //โหลดเมด
    const maidLoader = new THREE.GLTFLoader();

    maidLoader.load('https://psorrayut.github.io/sorrayut/merchant.glb',
    function (gltf) {
    maid = gltf.scene;
    
    if (gltf.animations && gltf.animations.length > 0) {
      mixerMaid = new THREE.AnimationMixer(maid);
      gltf.animations.forEach((clip) => {
        const action = mixerMaid.clipAction(clip);
        action.play();
      });
    }
    
    maid.traverse(function (child) {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
        clickable.push(child); // เพิ่ม mesh เข้าไปใน clickable array
      }
    });
    
    maid.rotation.y = Math.PI / 2;
    maid.position.set(5, 0.5, 5); // ย้ายตำแหน่งให้เห็นชัด
    maid.name = 'maid'; // ตั้งชื่อให้ object
    scene.add(maid);
    console.log('เมดโหลดสำเร็จ at position:', maid.position);
    console.log('Clickable objects:', clickable.length);
  }
);
    // สร้างเมืองจำลอง
    function createSimpleCity() {
      const buildingMaterial = new THREE.MeshStandardMaterial({
        color: 0x2a2a2a,
        roughness: 0.8,
        metalness: 0.3,
        emissive: 0x111111,
        emissiveIntensity: 0.2
      });

      for (let i = 0; i < 30; i++) {
        const width = Math.random() * 3 + 2;
        const height = Math.random() * 20 + 8;
        const depth = Math.random() * 3 + 2;
        
        const building = new THREE.Mesh(
          new THREE.BoxGeometry(width, height, depth),
          buildingMaterial
        );
        
        const angle = (i / 30) * Math.PI * 2;
        const radius = Math.random() * 20 + 25;
        
        building.position.x = Math.cos(angle) * radius;
        building.position.z = Math.sin(angle) * radius;
        building.position.y = height / 2;
        
        building.castShadow = true;
        building.receiveShadow = true;
        
        if (Math.random() > 0.5) {
          const windowLight = new THREE.PointLight(0xffaa00, 0.5, 10);
          windowLight.position.copy(building.position);
          windowLight.position.y = height * 0.7;
          scene.add(windowLight);
        }
        
        scene.add(building);
      }
    }
    createSimpleCity();

    // พื้นถนน
    const roadGeo = new THREE.PlaneGeometry(200, 200);
    const roadMat = new THREE.MeshStandardMaterial({
      color: 0x1a1a1a,
      roughness: 0.9,
      metalness: 0.1,
      emissive: 0x0a0a0a,
      emissiveIntensity: 0.2
    });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0;
    road.receiveShadow = true;
    scene.add(road);

    // Resize Handler
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Animation Loop
    const clock = new THREE.Clock();
    
    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      if (mixerCar) mixerCar.update(delta);
      if (mixerMaid) mixerMaid.update(delta);
      
      updateCar();
      updateCamera(); // เรียกแยกต่างหาก
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
